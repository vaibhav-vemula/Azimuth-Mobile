<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<link rel="icon" type="image/svg+xml" href="/logo.svg">
<title>Azimuth admin</title>
<link rel="stylesheet" href="/vendor/leaflet.css">
<style>
  :root { --bg:#05070d; --card:#0b0f1a; --line:rgba(255,255,255,.12); --text:#f5f7fa; --muted:#9aa5b1; --accent:#4dd0e1; --bad:#ef5350; --good:#66bb6a; --warn:#ffb74d; }
  * { box-sizing: border-box; }
  body { margin:0; background:var(--bg); color:var(--text); font:14px/1.5 system-ui, sans-serif; }
  header { display:flex; gap:24px; align-items:center; padding:14px 20px; border-bottom:1px solid var(--line); flex-wrap:wrap; }
  header h1 { font-size:18px; margin:0; } .stat b { display:block; font-size:20px; } .stat span { color:var(--muted); font-size:12px; }
  main { display:grid; grid-template-columns: 340px 1fr; gap:16px; padding:16px 20px; }
  @media (max-width: 900px) { main { grid-template-columns: 1fr; } }
  .panel { background:var(--card); border:1px solid var(--line); border-radius:14px; padding:14px; }
  .item { padding:10px; border:1px solid var(--line); border-radius:10px; margin-bottom:8px; cursor:pointer; }
  .item.active { border-color:var(--accent); } .item .top { display:flex; justify-content:space-between; gap:8px; }
  .muted { color:var(--muted); } .mono { font-family: ui-monospace, monospace; font-size:12px; word-break:break-all; }
  .tag { display:inline-block; padding:1px 8px; border-radius:999px; border:1px solid; font-size:11px; }
  .tag.good { color:var(--good); } .tag.bad { color:var(--bad); } .tag.warn { color:var(--warn); }
  #map { height: 320px; border-radius:10px; margin:10px 0; background:#111; }
  table { width:100%; border-collapse:collapse; } td, th { text-align:left; padding:4px 8px 4px 0; vertical-align:top; } th { color:var(--muted); font-weight:500; }
  button { padding:10px 16px; border:0; border-radius:10px; font:inherit; font-weight:600; cursor:pointer; }
  button.approve { background:var(--good); color:#05070d; } button.reject { background:var(--bad); color:#fff; } button.ghost { background:transparent; color:var(--accent); border:1px solid var(--line); }
  button:disabled { opacity:.4; cursor:not-allowed; }
  input[type=text] { width:100%; padding:10px; border-radius:10px; border:1px solid var(--line); background:#05070d; color:var(--text); font:inherit; }
  .row { display:flex; gap:10px; align-items:center; flex-wrap:wrap; margin-top:10px; }
  pre { background:#05070d; border:1px solid var(--line); border-radius:10px; padding:10px; max-height:300px; overflow:auto; font-size:12px; }
  ul { margin:6px 0; padding-left:18px; }
</style>
</head>
<body>
<header>
  <img src="/logo.svg" alt="" width="30" height="30" style="border-radius:8px">
  <h1>Azimuth admin</h1>
  <div class="stat"><b id="waiting">–</b><span>submissions waiting</span></div>
  <div class="stat"><b id="payableTotal">–</b><span>USDC approved, not yet paid</span></div>
  <div class="stat"><b id="wallets">–</b><span>wallets in the next payout</span></div>
  <button class="ghost" id="reload">Refresh</button>
</header>
<main>
  <section class="panel"><h2 style="margin-top:0;font-size:15px">Waiting for review</h2><div id="list" class="muted">Loading…</div></section>
  <section class="panel" id="detail"><p class="muted">Choose a submission on the left.</p></section>
</main>
<section class="panel" id="payouts-panel" style="margin:12px 18px">
  <h2 style="margin-top:0;font-size:15px">AZMTest payouts</h2>
  <button class="ghost" id="settle">Check challenge claims now</button>
  <div id="vault" class="muted">Loading…</div>
  <div id="payouts" class="muted"></div>
</section>
<script src="/vendor/leaflet.js"></script>
<script src="/hex.js"></script>
<script src="/admin.js"></script>
</body>
</html>
