[package]
name = "azimuth_bounty"
version = "0.1.0"
description = "Escrow for Azimuth measurement bounties"
edition = "2021"
license = "GPL-3.0-or-later"

[lib]
crate-type = ["cdylib", "lib"]
name = "azimuth_bounty"

[features]
default = []
cpi = ["no-entrypoint"]
no-entrypoint = []
no-idl-build = []
no-log-ix-name = []
short-grace = []
idl-build = ["anchor-lang/idl-build", "anchor-spl/idl-build"]

[dependencies]
anchor-lang = "0.31.0"
anchor-spl = "0.31.0"
